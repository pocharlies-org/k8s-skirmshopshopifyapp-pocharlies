# Daily PICQER PRICE SYNC → catalogo (SC-5827: was the brain). Keeps the Prices
# tab's Coste/Margen (Picqer fixedstockprice) and NL (skirmshop.nl) fresh for the
# WHOLE catalog, not just the ~650 products covered by the synapse
# manufacturer-sync driver. Runs the script from the generated ConfigMap
# (picqer-price-sync-script) inside the rag-app image (needs @prisma/client to
# read/write `catalogo`; NODE_PATH points require() at the image's node_modules).
# GAP-FILL: only fills products missing cost/NL, never overwrites the driver's
# data (see the script header for the v1 limitation).
# DEPENDS ON PR #55 (Secret `rag-catalogo-db`): merge it first.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: picqer-price-sync
spec:
  suspend: false
  schedule: "30 4 * * *" # daily 04:30 (Europe/Madrid) — after the nightly catalog syncs
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800 # paginates Picqer (~140 pages) + both storefronts + catalogo
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: picqer-price-sync
              image: shopify-app # rewritten by kustomize images: -> harbor …skirmshopshopifyapp:<tag> (@prisma/client)
              command: ["node", "/script/picqer-price-sync.js"]
              env:
                - { name: APPLY, value: "1" }
                # The script lives in /script (ConfigMap); require() must find the
                # image's @prisma/client in /app/node_modules.
                - { name: NODE_PATH, value: "/app/node_modules" }
                # catalogo (postgres-shared) — Secret from PR #55 (externalsecret-catalogo-db.yaml).
                - name: CATALOGO_DATABASE_URL
                  valueFrom: { secretKeyRef: { name: rag-catalogo-db, key: CATALOGO_DATABASE_URL } }
                # Picqer creds reused from the collections-tree app's ESO secret
                # (same namespace). Both keys verified present.
                - name: PICQER_API_KEY
                  valueFrom: { secretKeyRef: { name: collections-tree-secrets, key: PICQER_API_KEY } }
                - name: PICQER_SUBDOMAIN
                  valueFrom: { secretKeyRef: { name: collections-tree-secrets, key: PICQER_SUBDOMAIN } }
              volumeMounts:
                - { name: script, mountPath: /script }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: script
              configMap:
                name: picqer-price-sync-script
