# Weekly redirect-health audit (SEO recovery, plan fluffy-koala 2026-07-29).
# Logic lives in redirect-health.js, mounted from a ConfigMap (same pattern as the
# other node CronJobs here). Read-only: dumps every urlRedirect plus the live URL
# set via bulkOperationRunQuery, cross-checks in memory (chain / target-404 /
# target-empty) and, over the cap, SENDS A TELEGRAM ALERT AND EXITS 0. Never writes.
#
# 2026-08-20: dejo de fallar el Job. Es SEMANAL, asi que un Job rojo se quedaba
# siete dias en el historial y mantenia la Application `skirmshopshopifyapp` en
# Degraded hasta que alguien reparase 163 redirects — tapando cualquier Degraded
# de verdad de esta app. El aviso es la senal; el Job rojo no. Un exit != 0 sigue
# siendo lo correcto para un FALLO real (sin datos, error de API, Telegram caido).
# Rationale: 426 deleted collections + 435 deleted products silently broke ~10k of
# the 26.569 redirects after the Feb-Mar 2026 migration. This catches regressions
# every time someone deletes a product/collection from the admin.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redirect-health
spec:
  suspend: false
  schedule: "15 4 * * 1" # lunes 04:15 Europe/Madrid
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: redirect-health
              # node:20-alpine, no la imagen de la app: esto solo habla con la
              # Admin API. La imagen de la app NO trae curl, con lo que la version
              # anterior de este cron moria en la primera linea con "curl: not found"
              # (comprobado ejecutandolo a mano el 31-jul-2026, antes de su primer
              # disparo programado).
              image: node:20-alpine
              command: ["node", "/script/redirect-health.js"]
              env:
                # SUELO MEDIDO, no un numero redondo. Ejecutado a mano el
                # 31-jul-2026 contra la tienda: chains=0 target404=97 targetEmpty=8
                # = 105 rotos. Son los destinos genuinamente borrados que la
                # campana de reparacion dejo a proposito (SKUs administrativos,
                # codigos de pedido): borrar un 301 roto lo convierte en 404, que
                # es peor, asi que se quedan. Con el cap original de 50 este job
                # habria fallado TODOS los lunes desde el primero — y un cron
                # cronicamente rojo se ignora, que es como se pierde la senal real.
                # 130 deja ~25 de margen: suficiente para no llorar por churn
                # normal, ajustado para cazar un borrado masivo. Si algun dia se
                # limpia el residuo, rebajalo.
                - { name: BROKEN_CAP, value: "130" }
                # Mismo bot y mismo chat que el resto de crons de este repo, ver
                # cronjob-reconcile-summary.yaml. Sin esto el script no tiene por
                # donde avisar y falla a proposito: un silencio que parece un OK
                # es peor que un job rojo.
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: labels-telegram-bot
                      key: bot_token
                - { name: TELEGRAM_CHAT_ID, value: "-1003984393379" }
              envFrom:
                - secretRef:
                    name: rag-secrets # SHOPIFY_STORE / SHOPIFY_ACCESS_TOKEN / SHOPIFY_API_VERSION
              volumeMounts:
                - { name: script, mountPath: /script }
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: script
              configMap:
                name: redirect-health-script
