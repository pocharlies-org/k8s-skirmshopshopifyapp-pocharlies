# SC-5827 · credencial propia de rag-app en la frontera escritora de Hindsight (identidad `skirmshop-rag-app`, bank
# `tienda`, con delete y document_id crudo), creada por security en SC-5829. Sustituye a la clave de tenant que usaba
# el espejo del Brain. Forma Connect. Nombre literal del Secret: `namePrefix: rag-` no reescribe spec.target.name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-writer
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: rag-hindsight-writer
    creationPolicy: Owner
  data:
    - secretKey: HINDSIGHT_TOKEN
      remoteRef: {key: hindsight-writer-skirmshop-rag-app, property: token}
