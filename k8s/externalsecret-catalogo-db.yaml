# SC-5827: la base `catalogo` (postgres-shared) pasa del Brain a rag-app, que la escribe desde su webhook de Shopify
# y la lee para la pestaña Prices. Mismo rol `catalogo` (item 1Password `catalogo-db`) que usaba el Brain: muere el
# Brain, el rol no. Forma Connect. Nombre literal del Secret: `namePrefix: rag-` no reescribe spec.target.name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalogo-db
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: rag-catalogo-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CATALOGO_DATABASE_URL: "postgresql://{{ .user | urlquery }}:{{ .password | urlquery }}@postgres-shared-nvme-rw.databases.svc.cluster.local:5432/catalogo"
  data:
    - secretKey: user
      remoteRef: {key: catalogo-db, property: DB_USER}
    - secretKey: password
      remoteRef: {key: catalogo-db, property: DB_PASSWORD}
