# Nightly taxonomy SEMANTIC VERIFIER (proposal-only). Closes the gap the
# deterministic canonicalize job (cronjob-canonicalize.yaml) leaves open: that one
# only snaps FORMAT/alias drift, it never checks whether a facet value is
# semantically CORRECT. This job re-classifies recently-changed / missing-facet
# products via the LLM (role alias `tooling`), diffs current↔proposed canonical,
# and writes REVIEW-ONLY AIProposal rows (proposalType "taxonomy_verification")
# plus a Telegram digest. It NEVER writes to Shopify — corrections only reach the
# store through the human-gated apply path (/app/content). Entry point = the
# esbuild bundle build/taxonomy-verify.cjs (Dockerfile).
#
# ACTIVATED 2026-06-19 (image v1.5.53 = feedback feature + taxonomy v1 policy).
# FASE 0 calibration passed: added-only v1 signal → 8 proposals / 200 products =
# 4.0%, under the 5% gate. Runs nightly; review proposals at /app/content + the
# Telegram digest (topic 33452). Anti-collision: runs 04:00, well clear of the canonicalize write
# window (02:30 + activeDeadlineSeconds 3600 → worst case 03:30). NOTE:
# concurrencyPolicy:Forbid only guards THIS CronJob against itself, NOT against
# the canonicalize cron — the 04:00 slot is the cross-cron safety margin.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: taxonomy-verify
spec:
  suspend: false
  schedule: "0 4 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 5400 # LLM over up to MAX_PRODUCTS in batches — generous
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: taxonomy-verify
              image: shopify-app # rewritten by kustomize images: → harbor …skirmshopshopifyapp:<tag>
              command: ["node", "build/taxonomy-verify.cjs"]
              envFrom:
                - secretRef:
                    name: rag-secrets # SHOPIFY_STORE / SHOPIFY_ACCESS_TOKEN / SHOPIFY_API_VERSION / DATABASE_URL
              env:
                # DB connection — MUST mirror the base Deployment's explicit override
                # (k8s-shopify-framework base): rag-secrets carries a BOGUS
                # DATABASE_URL host (shared-postgres, ENOTFOUND); the real CNPG endpoint
                # is built here from the shared-postgres-app secret. Without this the
                # cron inherits the broken envFrom value and crashes at the Prisma write
                # (PrismaClientInitializationError, observed on the first 04:00 run).
                # DB_USER/DB_PASSWORD must precede DATABASE_URL for $(VAR) expansion.
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: shared-postgres-app
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: shared-postgres-app
                      key: password
                - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop" }
                # LiteLLM in-cluster gateway (NOT the 127.0.0.1:14000 dev default).
                - { name: LITELLM_BASE, value: "http://litellm.litellm.svc.cluster.local:4000" }
                # Master key materialized by externalsecret-litellm.yaml (Vault secret/litellm).
                - name: LITELLM_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rag-litellm-key
                      key: LITELLM_KEY
                # @synapse_skirmshop_bot token (same Vault path observability/prod/telegram).
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: labels-telegram-bot
                      key: bot_token
                # Digest → "Synapse monitor" (skirmshop ops) GENERAL topic. The old
                # thread 33452 ("Taxonomía & Filtros") returned "message thread not
                # found" on the first run, so no TELEGRAM_THREAD_ID → posts to General.
                - { name: TELEGRAM_CHAT_ID, value: "-1003785136626" } # "Synapse monitor" (skirmshop ops)
                # Signal policy. v1.5.54 gates part_category gap-fills to PART products
                # in code (diffFacets), so part_category is safe to re-enable: genuine
                # part fills (uppers/chassis/kits) surface, whole-gun false positives are
                # suppressed. (Stopgap was product_kind-only before the gate shipped.)
                - { name: ADDED_DIMS, value: "product_kind,part_category" }
                # Cost / coverage caps (the script also has its own defaults).
                - { name: MAX_PRODUCTS, value: "300" }
                - { name: MAX_PROPOSALS, value: "100" }
                - { name: WINDOW_DAYS, value: "7" }
                - { name: MAX_TOKENS_BUDGET, value: "4000000" }
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
