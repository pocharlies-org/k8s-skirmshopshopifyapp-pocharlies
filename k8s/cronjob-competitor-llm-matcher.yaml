# Daily COMPETITOR LLM MATCHER → brain. Links our active products to scraped
# `competitor:*` CompetitorProduct nodes one-by-one with a strict 2-stage LLM
# judge (100%-identical gate) and emits a `competitor_match` push-ingest doc so
# the brain materialises (Product)-[:PRODUCT_MATCH]->(CompetitorProduct); the
# Prices tab reads min/avg/max from those edges. Non-matches stamp the Product
# (competitor_checked_at) so they're skipped next run (resumable). Self-contained:
# node:20 runs the script from the generated ConfigMap; no app image rebuild.
# In-cluster only (brain + litellm) — no external egress. Complements the
# competitor crawler (which writes the CompetitorProduct nodes).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: competitor-llm-matcher
spec:
  # Downstream del crawler de competidores, retirado el 2026-08-21.
  suspend: true
  schedule: "30 5 * * *" # daily 05:30 (Europe/Madrid) — after nl-llm-matcher (05:00)
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3300 # batch of LLM calls + brain pagination
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: competitor-llm-matcher
              image: node:20-alpine
              command: ["node", "/script/competitor-llm-matcher.js"]
              env:
                - { name: APPLY, value: "1" }
                - { name: BATCH, value: "200" } # new/undecided products per night (resumable)
                - { name: CONC, value: "6" }
                - { name: MODEL, value: "tooling" }
                - { name: MIN_CONF, value: "0.9" }
                - { name: TOPK, value: "6" }
                - { name: BRAIN_URL, value: "http://skirmshop-brain.skirmshop-brain-prod.svc.cluster.local" }
                - { name: LITELLM_URL, value: "http://litellm.litellm.svc.cluster.local:4000" }
                - name: BRAIN_API_KEY
                  valueFrom: { secretKeyRef: { name: rag-secrets, key: BRAIN_API_KEY } }
                - name: LITELLM_KEY
                  valueFrom: { secretKeyRef: { name: rag-litellm-key, key: LITELLM_KEY } }
              volumeMounts:
                - { name: script, mountPath: /script }
              resources:
                requests: { cpu: 150m, memory: 512Mi }
                limits: { memory: 1Gi }
          volumes:
            - name: script
              configMap:
                name: competitor-llm-matcher-script
