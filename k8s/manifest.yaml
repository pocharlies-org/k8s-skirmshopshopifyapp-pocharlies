apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-shopify-app
  labels:
    app.kubernetes.io/name: legacy-shopify-app
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: legacy-shopify-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-shopify-app
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: app
          image: harbor.e-dani.com/homelab/skirmshopshopifyapp:pending
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3456
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3456"
            - name: SHOPIFY_APP_URL
              value: https://skirmshop.e-dani.com
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop
          envFrom:
            - secretRef:
                name: legacy-shopify-app-secrets
                optional: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-shopify-app
  labels:
    app.kubernetes.io/name: legacy-shopify-app
spec:
  selector:
    app.kubernetes.io/name: legacy-shopify-app
  ports:
    - name: http
      port: 80
      targetPort: http
