apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skirmshop

# Reuse the shared Shopify-app base (same pattern as k8s-shopify-sii-pocharlies):
# Deployment `app` + Service `app` + edge IngressRoute `app`.
resources:
  - https://github.com/pocharlies-org/k8s-shopify-framework-pocharlies.git//base?ref=deploy/prod
  # cronjob-canonicalize.yaml removed (SKIRM-626, SC-5617): el barrido nocturno de
  # canonicalize muere — los products/create|update ya registrados en
  # /webhooks/catalogo canonicalizan por producto (skirmshopshopifyapp PR SKIRM-626).
  - externalsecret-litellm.yaml
  - externalsecret-catalogo-db.yaml
  - externalsecret-hindsight-writer.yaml
  - configmap-hindsight-ca.yaml
  # cronjob-taxonomy-verify + cronjob-proposals-digest removed 2026-09-26:
  # proyecto taxonomy-verification archivado como deprecated (suspend via PR #36
  # la noche anterior; historial completo en git y wiki #taxonomia-catalogo).
  - cronjob-picqer-price-sync.yaml
  - cronjob-nl-llm-matcher.yaml
  # cronjob-provider-sourcing-backfill.yaml removed (SC-6602 row #61): el re-sello
  # nocturno (04:30) de product_creator.provider_sourcing pasa a evento - recordSyncResult
  # re-sella los productos que cada sync toca (sin barrido de respaldo, decision C-2).
  - product-weight-edge.yaml
  - cronjob-redirect-health.yaml
  - cronjob-parent-health.yaml

namePrefix: rag-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: rag

# Script for the picqer-price-sync CronJob, mounted as a ConfigMap. The hash
# suffix makes it immutable + rolls the next Job when the script changes. The
# CronJob volume references the base name `picqer-price-sync-script`; kustomize
# rewrites it to the hashed+prefixed name.
configMapGenerator:
  - name: picqer-price-sync-script
    files:
      - picqer-price-sync.js
  - name: nl-llm-matcher-script
    files:
      - nl-llm-matcher.js
  - name: redirect-health-script
    files:
      - redirect-health.js
  - name: parent-health-script
    files:
      - parent-health.js

images:
  - name: shopify-app
    newName: harbor.lan.e-dani.com/homelab/skirmshopshopifyapp
    newTag: sc6810-mirror-abort-20261127
    digest: sha256:e25c8d753c59c685c106ea9ba65098b74ece102b74f03d5642e4f36e613d90d2

patches:
  # App = "Pocharlies Catalog RAG Sync" (legacy skirmshopshopifyapp). Embedded at
  # the ROOT of skirmshop.e-dani.com (application_url /app/rag, auth at /auth).
  - target: { kind: Deployment, name: app }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            # SII client certificate (same secret + keys as the sii app). The app
            # carries SII/invoicing code; mounting avoids cert-path errors on the
            # routes that touch it. Source secret `sii-certificate`: sii.p12 + passphrase.
            volumes:
              - name: sii-certificate
                secret: { secretName: sii-certificate }
              - name: hindsight-ca
                configMap: { name: hindsight-ca }
            containers:
              - name: app
                command: ["/bin/sh", "-c"]
                args:
                  - npx prisma migrate deploy && exec ./node_modules/.bin/remix-serve ./build/server/index.js
                env:
                  # AUTH INVARIANT: must equal the public URL exactly (root, no prefix).
                  - { name: SHOPIFY_APP_URL, value: "https://skirmshop.e-dani.com" }
                  # Real Shopify auth (token exchange) instead of the dev bypass, so
                  # the UI + /api/price-lists require a real session. Overrides the
                  # rag-secrets envFrom value. ROLLBACK: set "true" + redeploy.
                  - { name: DEV_MODE, value: "false" }
                  # Customer Account order self-service stays canary-only. The
                  # extension checks this server-side allowlist with a verified
                  # Customer Accounts session; the server is the enforcement boundary.
                  - name: CUSTOMER_ORDER_SELF_SERVICE_ALLOWED_CUSTOMER_IDS
                    value: "gid://shopify/Customer/10217917219157"
                  # Reconciliación autónoma: arma el lazo aprobar→aplicar (el
                  # apply-tick de synapse polea las `approved`). El apply sigue
                  # en dry-run hasta que la Fase 5 ponga RECONCILE_APPLY_DRYRUN=false
                  # en el adapter synapse. Kill-switch global: poner "false" aquí.
                  - { name: RECONCILE_APPLY_ENABLED, value: "false" }
                  # A: create-draft autónomo. El poller (create-draft.v1 event +
                  # create-draft-tick schedule) crea DRAFTS para productos NUEVOS
                  # unmatched encolados por el sync; gated per-fabricante por
                  # ManufacturerCatalog.autoCreateDrafts (default false). DRAFTS no
                  # se publican. Kill-switch global: poner "false" aquí.
                  - { name: CATALOG_CREATE_DRAFT_ENABLED, value: "true" }
                  - { name: CATALOG_IMPORT_ENABLED, value: "true" }
                  # SC-5978: pool de Prisma del web de rag-app. El base del framework
                  # fija connection_limit=5 (→10 físicas/pod: el framework crea su
                  # propio PrismaClient además del de la app). rag-app es el único
                  # consumidor que lo agota: su webhook de catálogo lanza un fan-out
                  # concurrente de upserts y los flujos de sync (sync-start /
                  # sync-heartbeat / manual-matches) sostienen conexiones 8-23 s; con
                  # 5 la cola supera pool_timeout=15 y /api/competitors/.../sync-start
                  # devuelve 500 (PrismaClientKnownRequestError: connection_limit: 5,
                  # timeout: 15), lo que tumba el workflow synapse
                  # `competitors.sync.source` (100 % de fallos ~8/día desde el 11-11).
                  # El base lo permite explícitamente: "sube el número en el overlay
                  # si un app demuestra que necesita más". 15/cliente = 30 físicas/pod,
                  # 60 durante un rolling update — dentro del margen de postgres-shared
                  # (293/500 medidas). Mitigación operativa; el arreglo durable (acotar
                  # la concurrencia del fan-out y no sostener la tx durante trabajo
                  # no-DB) es del equipo de rag-app.
                  # k8s solo expande $(VAR) de variables definidas antes en la misma lista:
                  # DB_USER/PASSWORD tienen que ir ANTES de DATABASE_URL.
                  - name: DB_USER
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: username } }
                  - name: DB_PASSWORD
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: password } }
                  - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop?connection_limit=15&pool_timeout=15&connect_timeout=10" }
                  # Catalog API credentials have an explicit Vault/ESO owner.
                  # Explicit env entries override the legacy rag-secrets envFrom
                  # values and provide a bounded zero-downtime overlap window.
                  - name: CATALOG_SYNC_TOKEN
                    valueFrom:
                      secretKeyRef: { name: catalog-api-server, key: CATALOG_SYNC_TOKEN }
                  - name: CATALOG_SYNC_TOKEN_PREVIOUS
                    valueFrom:
                      secretKeyRef: { name: catalog-api-server, key: CATALOG_SYNC_TOKEN_PREVIOUS }
                  - { name: SCOPES, value: "write_products,read_products,write_content,read_content,write_inventory,read_inventory,write_online_store_navigation,read_online_store_navigation,read_customers,write_customers,read_customer_address,read_customer_email,read_customer_name,read_customer_phone,read_reports,read_locations,read_publications,write_publications,write_orders,read_orders,read_all_orders,read_returns,write_order_edits,read_order_edits,write_merchant_managed_fulfillment_orders,read_merchant_managed_fulfillment_orders,read_translations,write_translations,write_locales,write_discounts,read_discounts,read_shipping,write_shipping,read_legal_policies,read_markets,write_markets,read_themes,write_themes,read_store_credit_accounts,write_store_credit_account_transactions,read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_draft_orders,write_draft_orders,read_files,write_files,read_shopify_payments_accounts,read_shopify_payments_disputes" }
                  - { name: SII_CERTIFICATE_PATH, value: "/app/secrets/sii.p12" }
                  - name: SII_CERTIFICATE_PASSPHRASE
                    valueFrom:
                      secretKeyRef: { name: sii-certificate, key: passphrase }
                  # SC-5827: base `catalogo` (webhook de Shopify y pestaña Prices), antes del Brain.
                  # SC-5887: el rol `catalogo` tiene connectionLimit 20 (CNPG) y sin
                  # connection_limit Prisma abre hasta 2×CPU+1 (97 en sauvage): el 18-11
                  # rag-app se quedó las 20 ociosas de 14:56 a 15:50 y los Jobs de
                  # picqer-price-sync fallaron con «too many connections». Reparto de
                  # los 20: rag-app 10 + nl-llm-matcher 3 + price-sync 3 + un Job de
                  # evento 3 (los scripts fijan su 3 en código).
                  # shortcut: el secreto no lleva query (si la lleva, el «?» rompe la URL);
                  # pasar el tope a catalogoClient() si aparece otro consumidor en rag-app.
                  - name: CATALOGO_DATABASE_URL_BASE
                    valueFrom:
                      secretKeyRef: { name: rag-catalogo-db, key: CATALOGO_DATABASE_URL }
                  - { name: CATALOGO_DATABASE_URL, value: "$(CATALOGO_DATABASE_URL_BASE)?connection_limit=10&pool_timeout=15&connect_timeout=10&application_name=rag-app" }
                  # SC-5827: espejo del bank `tienda` por la frontera escritora (identidad skirmshop-rag-app).
                  - { name: HINDSIGHT_URL, value: "https://hindsight-writer.hindsight.svc:8443" }
                  - name: HINDSIGHT_TOKEN
                    valueFrom:
                      secretKeyRef: { name: rag-hindsight-writer, key: HINDSIGHT_TOKEN }
                  - { name: NODE_EXTRA_CA_CERTS, value: "/etc/hindsight-writer/ca.crt" }
                  # LiteLLM gateway for the "Corregir con IA" proposal-correction
                  # endpoint (/api/content correct-proposal → reclassify-one). The
                  # verifier LLM path previously ran ONLY in cronjob-taxonomy-verify;
                  # the web pod needs these or the endpoint 503s. Secret rag-litellm-key
                  # already exists (externalsecret-litellm.yaml, Vault secret/litellm).
                  - { name: LITELLM_BASE, value: "http://litellm.litellm.svc.cluster.local:4000" }
                  # rag-secrets is manually managed. Pin the canonical split-DNS
                  # endpoint declaratively here; explicit env wins over envFrom.
                  - { name: LLM_BASE_URL, value: "https://litellm.e-dani.com/v1" }
                  # 2026-08-15: `taxonomy` -> `tooling`. `taxonomy` era uno de los cuatro
                  # nombres (dense, dense-reasoning, dense-uncensored, taxonomy) que
                  # apuntaban al MISMO backend con parametros identicos — comprobado en
                  # /model/info: mismo api_base, mismo model, mismo repetition_penalty.
                  # `tooling` es el nombre de CAPACIDAD y ademas sobrevive al cambio de
                  # residente: en creative lo sirve el 27B denso, en llm-tp DeepSeek.
                  # `taxonomy` no: es un nombre explicito que falla duro si el residente
                  # de creative no esta. Este job prefiere degradar a fallar.
                  - { name: LITELLM_MODEL, value: "tooling" }
                  - { name: TAXONOMY_LLM_MODEL, value: "tooling" }
                  - name: LITELLM_KEY
                    valueFrom:
                      secretKeyRef: { name: rag-litellm-key, key: LITELLM_KEY }
                envFrom:
                  - secretRef: { name: rag-secrets }
                volumeMounts:
                  - { name: sii-certificate, mountPath: /app/secrets, readOnly: true }
                  - { name: hindsight-ca, mountPath: /etc/hindsight-writer, readOnly: true }
  # Embedded app mounted at root: match the bare host, no PathPrefix, no strip.
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: app }
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`skirmshop.e-dani.com`)
