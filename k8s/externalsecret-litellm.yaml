# LiteLLM master key for the taxonomy-verify CronJob — pulled from the same Vault
# path LiteLLM itself uses (secret/litellm), mirroring the cron-alert-analyzer
# pattern (k8s-observability-pocharlies). Materializes a Secret in ns skirmshop so
# the cron can mount LITELLM_KEY without cross-namespace secret access.
#
# NOTE on names: kustomize `namePrefix: rag-` renames this ExternalSecret object's
# metadata.name, but NOT the literal strings in spec.target.name or the cron's
# secretKeyRef.name (the materialized Secret is created by ESO at runtime, not a
# kustomize-managed resource). Both are pinned to the literal `rag-litellm-key`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-key
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rag-litellm-key
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_KEY
      remoteRef:
        key: secret/litellm
        property: LITELLM_MASTER_KEY
