# Dedicated LiteLLM key for the RAG app, chatbot and the LLM-matcher CronJobs
# (LiteLLM alias `skirmshop-rag`). Materializes a Secret in ns skirmshop so the
# consumers can mount LITELLM_KEY without cross-namespace secret access.
#
# NOT the master key. It used to read secret/litellm#LITELLM_MASTER_KEY — the very
# property LiteLLM's own Secret is built from — so writing a rotated value here
# would have rewritten LiteLLM's master. The key lives in its own property.
#
# NOTE on names: kustomize `namePrefix: rag-` renames this ExternalSecret object's
# metadata.name, but NOT the literal strings in spec.target.name or the cron's
# secretKeyRef.name (the materialized Secret is created by ESO at runtime, not a
# kustomize-managed resource). Both are pinned to the literal `rag-litellm-key`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-key
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rag-litellm-key
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_KEY
      remoteRef:
        key: secret/litellm
        property: SKIRMSHOP_RAG_KEY
