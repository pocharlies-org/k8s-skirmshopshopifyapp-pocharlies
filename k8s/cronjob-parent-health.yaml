# Daily guard for the SEO recovery of the parent collections (plan fluffy-koala).
# Logic lives in parent-health.js, mounted from a ConfigMap (same pattern as the
# other node CronJobs here). Read-only: never writes to Shopify. Fails the job so
# a break surfaces in job history / alerting. See the header of the script for why
# each of the two checks exists.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: parent-health
spec:
  suspend: false
  schedule: "20 6 * * *" # diario 06:20 Europe/Madrid (no choca con redirect-health, lunes 04:15)
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: parent-health
              # node:20-alpine, no la imagen de la app: esto solo habla con la
              # Admin API. La imagen de la app NO trae curl, que es lo que dejaba
              # sin funcionar la version anterior de este cron.
              image: node:20-alpine
              command: ["node", "/script/parent-health.js"]
              env:
                - { name: EMPTY_PARENT_CAP, value: "4" }
              envFrom:
                - secretRef:
                    name: rag-secrets # SHOPIFY_STORE / SHOPIFY_ACCESS_TOKEN / SHOPIFY_API_VERSION
              volumeMounts:
                - { name: script, mountPath: /script }
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: script
              configMap:
                name: parent-health-script
